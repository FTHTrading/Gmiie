  # ─── SCRAPE Sources ─────────────────────────────────────────

  - id: bis-cbdc-tracker
    name: BIS CBDC Tracker
    url: https://www.bis.org/publ/othp42.htm
    source_type: SCRAPE
    scrape_method: PLAYWRIGHT
    credibility_tier: TIER_1
    poll_interval_seconds: 86400
    selectors:
      content: "#cmsContent"
      title: "h1"
    tags: [cbdc, central-bank, tracker]
    region: GLOBAL
    enabled: true

  - id: rwa-xyz
    name: RWA.xyz
    url: https://app.rwa.xyz
    source_type: SCRAPE
    scrape_method: PLAYWRIGHT
    credibility_tier: TIER_2
    poll_interval_seconds: 43200
    selectors:
      content: "main"
    tags: [rwa, tokenization, data, tracker]
    enabled: true

  # ─── Multilingual + Regional Sources ─────────────────────────

  - id: boc-news
    name: Bank of China - News
