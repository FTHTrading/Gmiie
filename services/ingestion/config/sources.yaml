# ─── XXXIII — Source Registry ─────────────────────────────────
# Master configuration for all content sources.
# Each source defines type, credibility, polling method, and extraction rules.

# ─── TIER 1: Central Banks, Regulators, Exchanges ─────────────

sources:
  # ── Federal Reserve ──────────────────────────────────────────
  - id: fed-rss
    name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 900
    tags: [central-bank, monetary-policy, regulation]
    region: US
    enabled: true

  - id: fed-speeches
    name: Federal Reserve — Speeches
    url: https://www.federalreserve.gov/feeds/speeches.xml
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 1800
    tags: [central-bank, speeches, policy]
    region: US
    enabled: true

  # ── SEC EDGAR ────────────────────────────────────────────────
  - id: sec-edgar
    name: SEC EDGAR
    url: https://efts.sec.gov/LATEST/search-index
    source_type: API
    scrape_method: API_CLIENT
    credibility_tier: TIER_1
    poll_interval_seconds: 1800
    tags: [sec, regulatory, filings, securities]
    region: US
    enabled: true

  - id: sec-rss
    name: SEC — Press Releases
    url: https://www.sec.gov/rss/news/press.xml
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 900
    tags: [sec, regulatory, enforcement]
    region: US
    enabled: true

  # ── BIS (Bank of International Settlements) ──────────────────
  - id: bis-rss
    name: BIS
    url: https://www.bis.org/doclist/bis_fsi_publs.rss
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 3600
    tags: [bis, international, central-bank, regulation]
    region: GLOBAL
    enabled: true

  # ── IMF ──────────────────────────────────────────────────────
  - id: imf-blog
    name: IMF Blog
    url: https://www.imf.org/en/Blogs/rss
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 3600
    tags: [imf, international, macro, policy]
    region: GLOBAL
    enabled: true

  # ── CFTC ─────────────────────────────────────────────────────
  - id: cftc-rss
    name: CFTC
    url: https://www.cftc.gov/Newsroom/PressReleases/RSS
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 1800
    tags: [cftc, derivatives, regulation, commodities]
    region: US
    enabled: true

  # ── ECB ──────────────────────────────────────────────────────
  - id: ecb-press
    name: ECB Press Releases
    url: https://www.ecb.europa.eu/rss/press.html
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_1
    poll_interval_seconds: 1800
    tags: [ecb, central-bank, euro, monetary-policy]
    region: EU
    enabled: true

  # ─── TIER 2: Major Financial Media ──────────────────────────

  - id: coindesk-rss
    name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    source_type: RSS
    scrape_method: RSS_NATIVE
    credibility_tier: TIER_2
    poll_interval_seconds: 600
