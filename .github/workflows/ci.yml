name: XXXIII CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  PNPM_VERSION: '9'

jobs:
  # ─── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build --filter='./packages/*'

  # ─── Build Apps ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        app: [web, gmiie, lps, studio]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter='./packages/*'

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} run build

  # ─── Build Services ────────────────────────────────────────
  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter='./packages/*'

      - name: Build AI Engine
        run: pnpm --filter @xxxiii/ai-engine run build

      - name: Build Queue Service
        run: pnpm --filter @xxxiii/queue run build

      - name: Build Publisher
        run: pnpm --filter @xxxiii/publisher run build

  # ─── Python Ingestion Service ──────────────────────────────
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: services/ingestion
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: services/ingestion
        run: |
          pip install ruff
          ruff check src/

  # ─── Database Migration Check ──────────────────────────────
  db-check:
    name: Database Schema Check
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xxxiii_test
          POSTGRES_USER: xxxiii
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        run: npx prisma generate

      - name: Apply migrations
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://xxxiii:test_password@localhost:5432/xxxiii_test
        run: npx prisma db push --accept-data-loss

  # ─── Deploy to Vercel (Production) ─────────────────────────
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [build, build-services, db-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - app: web
            domain: xxxiii.io
          - app: gmiie
            domain: gmiie.xxxiii.io
          - app: lps
            domain: lps.xxxiii.io
          - app: studio
            domain: studio.xxxiii.io
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: apps/${{ matrix.app }}
