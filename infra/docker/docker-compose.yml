version: '3.9'

# ═══════════════════════════════════════════════════════════════
# XXXIII.IO — Full Stack Development Environment
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d              # Start all infra services
#   docker compose up -d postgres redis meilisearch  # Infra only
#   docker compose --profile apps up  # Include Next.js apps
#
# Access:
#   PostgreSQL  → localhost:5432
#   Redis       → localhost:6379
#   Meilisearch → localhost:7700
#   Adminer     → localhost:8080
# ═══════════════════════════════════════════════════════════════

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xxxiii-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: xxxiii
      POSTGRES_USER: xxxiii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xxxiii_dev_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xxxiii']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: xxxiii-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Meilisearch ────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: xxxiii-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-xxxiii_meili_dev_key}
      MEILI_ENV: development
      MEILI_DB_PATH: /meili_data
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Adminer (DB Admin UI) ─────────────────────────────────
  adminer:
    image: adminer:4
    container_name: xxxiii-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ─── MinIO (S3-compatible storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: xxxiii-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-xxxiii}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-xxxiii_minio_2024}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Queue Worker (BullMQ) ─────────────────────────────────
  queue-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.queue
    container_name: xxxiii-queue-worker
    restart: unless-stopped
    profiles: ['workers']
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Ingestion Service (Python) ─────────────────────────────
  ingestion:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ingestion
    container_name: xxxiii-ingestion
    restart: unless-stopped
    profiles: ['workers']
    ports:
      - '8100:8100'
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  meili-data:
  minio-data:
